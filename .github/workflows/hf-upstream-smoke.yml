name: HF upstream smoke

# Read-only browser smoke of the built site against huggingface.co. Manual or weekly; never on push.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

concurrency:
  group: hf-upstream-smoke
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:live --reporter=list,json
        env:
          CI: 'true'
          PLAYWRIGHT_JSON_OUTPUT_FILE: live-report.json
      # A hub rate limit is not a site regression; say so instead of leaving a bare red run.
      - if: failure()
        run: |
          if grep -q 'HTTP 429 rate limited' live-report.json 2>/dev/null; then
            echo '## Upstream rate limit (HTTP 429) hit during the smoke run' >> "$GITHUB_STEP_SUMMARY"
            echo 'Failures marked `rate-limited` were refused by the hub; re-run later.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Live smoke failed without a rate limit; see the report' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-report
          path: |
            live-report.json
            test-results
          retention-days: 7
